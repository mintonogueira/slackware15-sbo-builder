name: Publicar imagem pronta

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Containerfile
      - config/**
      - scripts/**
      - slackbuilds/**
      - .github/workflows/publicar-imagem.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: slackware15-sbo-builder-image
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Preparar certificado de inicialização
        run: |
          mkdir -p build
          cp /etc/ssl/certs/ca-certificates.crt build/bootstrap-ca.crt

      - name: Validar scripts e índice local
        run: sudo bash tests/testar-scripts.sh

      - name: Autenticar no GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Construir a imagem completa
        run: |
          docker build \
            --progress=plain \
            --file Containerfile \
            --build-arg SOURCE_REPOSITORY="https://github.com/${{ github.repository }}" \
            --build-arg BUILD_REVISION="${{ github.sha }}" \
            --tag "ghcr.io/${{ github.repository }}:15.0" \
            --tag "ghcr.io/${{ github.repository }}:latest" \
            --tag "ghcr.io/${{ github.repository }}:sha-${{ github.sha }}" \
            .

      - name: Validar a imagem pronta
        run: |
          mkdir -p build/test-output
          mkdir -p build/test-output/rotinas/scripts \
            build/test-output/slackbuilds-personalizados
          for rotina in \
            entrypoint-servico.sh \
            gerenciar-repositorios.sh \
            gerar-indice-repositorio.sh \
            atualizar-navegadores.sh \
            verificar-navegadores-diariamente.sh; do
            cp -p "scripts/$rotina" build/test-output/rotinas/scripts/
          done
          cp -Rp slackbuilds/. build/test-output/slackbuilds-personalizados/
          (
            cd build/test-output/rotinas
            find scripts -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          (
            cd build/test-output/slackbuilds-personalizados
            find . -mindepth 2 -maxdepth 2 -type f -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          docker run --rm \
            --volume "$PWD/build/test-output:/work:rw" \
            "ghcr.io/${{ github.repository }}:15.0" --self-test
          docker run --rm --entrypoint /bin/sh \
            "ghcr.io/${{ github.repository }}:15.0" -c '
              test ! -e /usr/local/bin/gerenciar-repositorios
              test ! -e /opt/browser-slackbuilds
              test ! -e /opt/slackrepo/rotinas-padrao
            '
          docker run -d \
            --name slackware-repo-test \
            --publish 18080:80 \
            --volume "$PWD/build/test-output:/work:rw" \
            "ghcr.io/${{ github.repository }}:15.0"

          cleanup_test_container() {
            status=$?
            if [ "$status" -ne 0 ]; then
              printf '%s\n' 'Falha ao validar o serviço. Estado e logs do contêiner:'
              docker inspect --format \
                'estado={{.State.Status}} codigo={{.State.ExitCode}} erro={{.State.Error}}' \
                slackware-repo-test 2>/dev/null || true
              docker logs slackware-repo-test 2>&1 || true
            fi
            docker rm --force slackware-repo-test >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup_test_container EXIT

          servico_pronto=0
          for attempt in $(seq 1 300); do
            if [ "$(docker inspect --format '{{.State.Running}}' \
                slackware-repo-test 2>/dev/null)" != true ]; then
              printf '%s\n' 'O contêiner encerrou durante a inicialização.' >&2
              exit 1
            fi
            if curl --fail --silent --show-error \
                --connect-timeout 2 --max-time 5 \
                http://127.0.0.1:18080/ >/dev/null 2>&1; then
              servico_pronto=1
              break
            fi
            sleep 2
          done
          if [ "$servico_pronto" -ne 1 ]; then
            printf '%s\n' \
              'O Apache não ficou disponível após dez minutos.' >&2
            exit 1
          fi

          docker exec slackware-repo-test \
            /usr/local/bin/gerenciar-repositorios --self-test
          trap - EXIT
          docker rm --force slackware-repo-test >/dev/null

      - name: Publicar no GHCR
        run: |
          docker push "ghcr.io/${{ github.repository }}:15.0"
          docker push "ghcr.io/${{ github.repository }}:latest"
          docker push "ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
